apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-scoped workload resources for the ivylen cluster.
# A workload-owned resource (e.g. an ExternalSecret for an app) belongs here so it is only
# rendered where that workload runs. The ExternalSecret example below is left UNLISTED until
# the External Secrets Operator exists (GIT-6 / GIT-10) — its CRD is not yet installed, so
# listing it now would leave the resource permanently OutOfSync. Uncomment once ESO lands.
resources: []
  # - external-secrets/myapp-externalsecret.yaml
