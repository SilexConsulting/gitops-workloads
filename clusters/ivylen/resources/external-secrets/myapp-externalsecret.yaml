# Reference workload-owned resource: an External Secrets ExternalSecret for "myApp".
# Owner: the myApp workload — this resource is only meaningful where that workload runs, so it
# lives in a cluster (or env) scope and is listed only for clusters that run myApp.
#
# PLACEHOLDER: the External Secrets Operator does not exist yet (GIT-6 / GIT-10). This file is
# intentionally NOT listed in the sibling kustomization.yaml so it is never applied until the
# ESO CRDs are installed. When ESO lands: install/point a SecretStore, then uncomment the entry.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp
  namespace: myapp
  annotations:
    argocd.argoproj.io/sync-wave: "10" # after the workload and the ESO operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: myapp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: myapp/password
