# Default values for the photoprism workload (all clusters).
# Chart: photoprism-plus (https://charts.photoprism.app/photoprism). Override per env / cluster.
#
# Chart quirks (1.1.6):
# - `resources` is not wired into the StatefulSet template, so it is not set here (no effect).
# - a non-empty `config.PHOTOPRISM_SITE_URL` is emitted twice in the container env (siteURL helper +
#   the config loop); server-side apply rejects the duplicate key, so leave it unset.
# - the default securityContext (runAsUser 1000) cannot start the image: its s6-overlay `/init` needs
#   /run owned by the container user ("preinit: fatal: /run belongs to uid 0 instead of 1000") and the
#   chart has no way to mount a volume there. See securityContext below.

# Start as root so s6-overlay can prepare /run and the volumes, then PhotoPrism's init drops the app
# itself to PHOTOPRISM_UID/GID (1000) — the upstream docker-compose model. Only the s6 supervisors
# keep uid 0, with a minimal capability set and no privilege escalation.
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]

# Stable object names (StatefulSet/Service/PVCs `photoprism*`, Secret `photoprism-secrets`)
# instead of `<argo-app-name>-photoprism`; the appset's ignoreDifferences relies on the Secret name.
fullnameOverride: photoprism

adminUser: admin
# adminPassword: left empty -> generated on first sync and kept (see the appset's ignoreDifferences).
#   kubectl get secret photoprism-secrets -n photoprism-<env> \
#     -o jsonpath='{.data.PHOTOPRISM_ADMIN_PASSWORD}' | base64 -d

# SQLite (chart default) is fine for a small library; for large libraries or multiple users switch
# to MariaDB via `database.driver: mysql` + `database.passwordSecretName`.
database:
  driver: sqlite

persistence:
  originals:
    size: 50Gi
  storage:
    size: 10Gi # SQLite DB, thumbnails/sidecar cache, backups

config:
  PHOTOPRISM_DEFAULT_TIMEZONE: Europe/London
  PHOTOPRISM_UID: "1000" # see securityContext
  PHOTOPRISM_GID: "1000"
